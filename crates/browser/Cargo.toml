[package]
name = "browser"
edition.workspace = true
version.workspace = true
publish.workspace = true

# Read by `cargo run -p bundle` to assemble the macOS app bundle.
[package.metadata.cef.bundle]
helper_name = "browser_helper"

# The executable carries the product name shown by the OS (Dock, menus,
# Activity Monitor).
[[bin]]
name = "Echo"
path = "src/main.rs"

[dependencies]
echo_updater = { path = "../updater" }
echo_github = { path = "../github" }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
echo_ai = { path = "../ai", features = ["http", "native"] }
browser_core = { package = "core", path = "../core" }
engine = { path = "../engine" }
importer = { path = "../importer" }
# runtime_shaders: avoids requiring the Xcode Metal Toolchain at build time.
gpui = { version = "0.2", features = ["runtime_shaders"] }
raw-window-handle = "0.6"
unicode-segmentation = "1"
trash = "5"
serde_json = "1"
url = "2"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# Filesystem publication is dormant until explicitly integrated.
tempfile = "=3.27.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png"] }
global-hotkey = "0.9.0"
dirs = "6"
ring = "=0.17.14"
zeroize = "1.8"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSString", "objc2-core-foundation"] }

[dev-dependencies]
gpui = { version = "0.2", features = ["runtime_shaders", "test-support"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["shape"] }
