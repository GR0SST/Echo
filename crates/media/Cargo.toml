[package]
name = "echo_media"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
browser_core = { package = "core", path = "../core" }
dirs = "6"
notify = "8.2.1"
trash = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry", "objc2-core-foundation"] }

objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage", "objc2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
