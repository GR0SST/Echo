[package]
name = "echo_ai"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = []
http = ["dep:ureq", "dep:base64", "dep:sha2", "dep:rand", "dep:jsonwebtoken", "dep:fs2", "dep:dirs", "dep:scraper"]
native = ["dep:keyring"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zeroize = "1"
scraper = { version = "0.29", optional = true, default-features = false }
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"], optional = true }
dirs = { version = "5", optional = true }
fs2 = { version = "0.4", optional = true }
base64 = { version = "0.22", optional = true }
sha2 = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }
jsonwebtoken = { version = "9", optional = true }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"], optional = true }

[dev-dependencies]
rsa = "0.9"
