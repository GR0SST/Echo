[package]
name = "engine"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
# Type-check the real CEF bindings without downloading or compiling native CEF.
# This cannot produce a runnable/linked browser.
check-only = ["cef/dox"]

[dependencies]
base64 = "0.22"
cpal = "0.16"
crossbeam-queue = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
url = "2"
libloading = "=0.8.9"
ring = "=0.17.14"
zeroize = { version = "1", features = ["serde"] }
cef = { version = "=154.5.0", default-features = false, features = ["sandbox"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSGeometry", "objc2-core-foundation"] }
