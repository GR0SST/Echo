[package]
name = "engine"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
serde_json = "1"
cef = { version = "=154.5.0", default-features = false, features = ["sandbox"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "=0.8.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "objc2-core-foundation"] }
