[env]
# Prebuilt CEF binaries; cef-dll-sys downloads them here when missing.
# The bundle utility and scripts/with-cef.sh prefer the optional machine-local
# echo-extensions-dist; this remains the portable fallback.
# An explicit CEF_PATH in the environment also overrides this default.
CEF_PATH = { value = "third_party/cef", relative = true }
